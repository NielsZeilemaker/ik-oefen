name: Spelideeën zoeken

# Elke maandag: zoek op internet inspiratie voor nieuwe spellen (groep 3–8)
# en werk WENSLIJST.md op de dev-branch bij.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-schrijven
  cancel-in-progress: false

jobs:
  zoek:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: false

      - name: Claude zoekt ideeën
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "/spelideeen"
          # Geen Bash: deze run leest het web, dus hij mag alleen bestanden lezen en schrijven.
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 80
            --permission-mode acceptEdits
            --allowedTools "WebSearch,WebFetch,Read,Edit,Write,Glob,Grep,Skill"
            --disallowedTools "Bash"

      - name: Alleen WENSLIJST.md mag veranderd zijn
        run: |
          anders=$(git status --porcelain | grep -v ' WENSLIJST.md$' || true)
          if [ -n "$anders" ]; then echo "Onverwachte wijzigingen:"; echo "$anders"; exit 1; fi

      - name: Commit en push naar dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet -- WENSLIJST.md && git ls-files --error-unmatch WENSLIJST.md >/dev/null 2>&1 && { echo "Niets nieuws."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WENSLIJST.md
          git commit -m "Wenslijst: nieuwe spelideeën" -m "Co-Authored-By: Claude <noreply@anthropic.com>"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" HEAD:dev
